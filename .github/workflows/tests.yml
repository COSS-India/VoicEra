# .github/workflows/tests.yml
# Runs VoicEra's five pytest suites, one job per package, with line coverage.
# The suites must run in separate pytest invocations: apps/api and model-server
# each put their own tree on sys.path and collide if collected together.
# See docs/developer/guides/testing.md.
name: Tests

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            python: "3.11"
            workdir: .
            install: -r apps/api/requirements.txt pytest pytest-asyncio pytest-cov
            tests: apps/api/tests
            cov: apps/api/app
            # Known failures on staging as of 27 Nov 2026. Each one is a test
            # that no longer matches the code, not a CI problem. Fix the test
            # (or the code), then delete the line here.
            #  - Sarvam catalogue moved from bulbul:v2 to bulbul:v3 (9451f46);
            #    the test still asserts bulbul:v2.
            deselect: |
              apps/api/tests/test_configuration_routes.py::test_tts_setting_includes_scoped_tree

          - suite: runtime
            python: "3.11"
            workdir: .
            install: -r apps/api/requirements.txt -r apps/runtime/requirements.txt pytest pytest-asyncio pytest-cov
            tests: apps/runtime/tests
            cov: apps/runtime
            #  - Indic Orpheus TTS sample-rate handling changed (12bc440,
            #    9451f46); the tests still assert the old 24 kHz pinning.
            deselect: |
              apps/runtime/tests/test_orpheus_sample_rate_label.py::test_indic_orpheus_forces_24k_init_even_if_pipeline_requests_16k
              apps/runtime/tests/test_orpheus_sample_rate_label.py::test_indic_orpheus_run_tts_yields_native_rate_constant
              apps/runtime/tests/test_orpheus_sample_rate_label.py::test_indic_orpheus_start_pins_rate

          - suite: providers
            python: "3.11"
            workdir: .
            install: -r apps/api/requirements.txt -r apps/runtime/requirements.txt pytest pytest-asyncio pytest-cov
            tests: apps/providers/tests
            cov: apps/providers
            #  - Same bulbul:v2 -> bulbul:v3 catalogue change as the api suite.
            deselect: |
              apps/providers/tests/test_settings_by_model_language.py::test_sarvam_voice_options_split_by_model

          - suite: telephony
            python: "3.11"
            workdir: .
            install: -r apps/api/requirements.txt -r apps/runtime/requirements.txt pytest pytest-asyncio pytest-cov
            tests: apps/telephony/tests
            cov: apps/telephony
            #  - Vodafone Idea schema gained pull_username / pull_password
            #    (ca07526); the expected field sets were not updated.
            deselect: |
              apps/telephony/tests/test_schema.py::test_vi_secrets_and_dni_flow_fields
              apps/telephony/tests/test_schema.py::test_telephony_settings_and_auth_split

          - suite: model-server
            python: "3.12"
            workdir: model-server
            install: -r tests/requirements-dev.txt pytest-cov
            tests: tests
            cov: .
            #  - test_env_example: compose files read variables that
            #    .env.example does not document (ORPHEUS_*, NEMOTRON_*, ...).
            #  - test_grpc_facade: looks for model-server/setup.sh, which was
            #    deleted in a192bbc.
            # Node ids here are relative to model-server/tests, where
            # pytest.ini sets the rootdir.
            deselect: |
              test_env_example.py::test_every_variable_compose_reads_is_documented
              test_grpc_facade.py::test_the_facade_folder_is_hidden_from_the_model_menu_and_the_catalogue

    env:
      PYTHONPATH: ${{ github.workspace }}
      # The MinIO client refuses an empty secret. The OBD report tests build
      # one without patching it; they never reach a real MinIO. Do not set
      # SECRET_KEY or INTERNAL_API_KEY here: the runtime routing tests expect
      # them unset and fail when they are present.
      MINIO_SECRET_KEY: ci-only-not-a-secret

    defaults:
      run:
        working-directory: ${{ matrix.workdir }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install ${{ matrix.install }}

      - name: Run pytest
        env:
          DESELECT: ${{ matrix.deselect }}
        run: |
          args=()
          while IFS= read -r id; do
            [ -n "$id" ] && args+=(--deselect "$id")
          done <<< "$DESELECT"
          echo "Deselected known failures: $(( ${#args[@]} / 2 ))"
          pytest "${{ matrix.tests }}" -p no:cacheprovider -q -rfE \
            "${args[@]}" \
            --junitxml="junit-${{ matrix.suite }}.xml" \
            --cov="${{ matrix.cov }}" \
            --cov-report=term \
            --cov-report="xml:coverage-${{ matrix.suite }}.xml"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f "coverage-${{ matrix.suite }}.xml" ]; then
            python - "coverage-${{ matrix.suite }}.xml" "${{ matrix.suite }}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          rate = float(root.get("line-rate", 0)) * 100
          print(f"**{sys.argv[2]}** line coverage: {rate:.1f}%")
          PY
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.suite }}
          path: |
            ${{ matrix.workdir }}/junit-${{ matrix.suite }}.xml
            ${{ matrix.workdir }}/coverage-${{ matrix.suite }}.xml
          if-no-files-found: ignore
