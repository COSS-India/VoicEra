# Launchpad nginx (the "edge" service): one public origin for the whole app stack.
#
# Telephony providers and the browser need to reach `runtime` on the same
# hostname the UI is served from, so FRONTEND_URL and VOICE_SERVER_BASE_URL can
# both be that one URL. Runtime routes are listed explicitly; everything else
# goes to the Next.js frontend (which itself proxies /api/v1 to `api`).
#
# Sits behind either a Cloudflare tunnel (compose.public.yml) or, later, the
# host nginx + TLS for a real domain. Either way TLS ends before this server,
# hence X-Forwarded-Proto https.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    client_max_body_size 50m;

    # Docker's embedded DNS, re-resolved so a recreated runtime/frontend
    # container (new IP) does not leave the edge pointing at a dead address.
    resolver 127.0.0.11 valid=10s;
    set $runtime  runtime:7860;
    set $frontend frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # runtime: telephony answer webhook
    location = /answer { proxy_pass http://$runtime; }

    # runtime: browser test-call and agent WebSockets (/agent/{org}/{agent})
    location /agent/ {
        proxy_pass http://$runtime;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # runtime: VI telephony stream (WebSocket), integration info, recording webhook
    location /vi/ {
        proxy_pass http://$runtime;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # runtime: Plivo recording webhook
    location /plivo/ { proxy_pass http://$runtime; }

    location / { proxy_pass http://$frontend; }
}
