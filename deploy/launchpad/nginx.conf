# Reverse proxy for the Voicera Launchpad stack.
#
# Exposes the frontend and runtime under a single origin. Runtime endpoints
# (telephony webhooks and WebSockets) are routed explicitly; all other traffic
# is served by the frontend, which proxies /api/v1 to the API service.
#
# TLS is terminated upstream (Cloudflare tunnel or host reverse proxy).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 50m;

    # Resolve upstreams at request time via Docker's embedded DNS so that
    # recreated containers are picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $runtime  runtime:7860;
    set $frontend frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime: telephony answer webhook.
    location = /answer {
        proxy_pass http://$runtime;
    }

    # Runtime: agent WebSocket sessions.
    location /agent/ {
        proxy_pass http://$runtime;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Runtime: VI telephony streaming, integration info and recording webhook.
    location /vi/ {
        proxy_pass http://$runtime;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Runtime: Plivo recording webhook.
    location /plivo/ {
        proxy_pass http://$runtime;
    }

    # Frontend (UI and /api/v1 proxy).
    location / {
        proxy_pass http://$frontend;
    }
}
