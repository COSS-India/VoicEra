# Public ingress for the Voicera Launchpad stack.
#
# Overlay for docker-compose.yaml. Adds an nginx reverse proxy (edge) and a
# Cloudflare quick tunnel that publishes it.
#
# Usage:
#   docker compose -f docker-compose.yaml -f deploy/launchpad/compose.public.yml up -d
#
# Quick-tunnel URLs are ephemeral and change when the tunnel container is
# recreated. Keep FRONTEND_URL and VOICE_SERVER_BASE_URL in .env in sync with
# the active URL.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  edge:
    image: nginx:1.27.5-alpine
    container_name: voicera_launchpad_edge
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${EDGE_HOST_PORT:-3950}:80"
    volumes:
      - ./deploy/launchpad/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      frontend:
        condition: service_started
      runtime:
        condition: service_started
    networks:
      - app-network

  tunnel:
    image: cloudflare/cloudflared:2026.8.2
    container_name: voicera_launchpad_tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://edge:80"]
    logging: *default-logging
    depends_on:
      edge:
        condition: service_healthy
    networks:
      - app-network
