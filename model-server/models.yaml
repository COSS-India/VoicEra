# Catalogue of models the model-server can host.
#
# This is the single place a model is described, and the gateway serves it at
# /models.
#
# Not yet consumed by anything else: voicera_frontend still imports its own
# stt.json and tts.json, so those lists and this one can disagree. Pointing the
# frontend here is the work that makes this the single source of truth rather
# than merely the intended one.
#
# status:
#   ready    - the folder <kind>/<id>/ exists with a Dockerfile in it; set
#              <KIND>_MODEL=<id> in .env to deploy it
#   planned  - chosen, not built yet
#
# STT and "streaming": two different questions, and conflating them is a mistake
# that has already been made once here. Read them as:
#
#   partial_transcripts   what the CALLER gets. `native` or `client-side` both
#                         mean words come back while the speaker is still
#                         talking, which telephony requires and every STT model
#                         in this repo has always done. There is no `none`.
#   streaming_endpoint    whether the MODEL serves WS /v1/asr/ws. False does not
#                         mean the caller waits for a full sentence -- it means
#                         the client produces the partials instead, by
#                         re-transcribing the segment every AI4BHARAT_INTERIM_MS
#                         (600 ms). Same experience, more GPU per utterance.
#
# Adding a model = one entry here plus one folder. A test enforces that every
# `ready` id has a folder, so the two cannot drift apart.

stt:
  - id: indic-conformer
    name: AI4Bharat Indic Conformer 600M
    status: ready
    runtime: nemo
    sample_rate: 16000
    partial_transcripts: native        # server emits OpenAI Realtime deltas over WS
    streaming_endpoint: false          # no /v1/asr/ws; use OpenAI Realtime instead
    realtime_endpoint: true            # WS /v1/realtime?intent=transcription
    languages: [hi, bn, ta, te, kn, ml, mr, gu, pa, or, as, ur, ne, sa, brx, doi, kok, ks, mai, mni, sat, sd, bhb]
    notes: Bhili (bhb) uses a separate checkpoint; enable with BHILI_ENABLE=yes.

  - id: indic-transcribe
    name: AI4Bharat / BodhanAI Indic-Transcribe 1.2B
    status: ready
    runtime: nemo
    sample_rate: 16000
    upload_format: wav                 # soundfile only -- 415s headerless PCM
    partial_transcripts: native        # AlignAtt decodes incrementally
    streaming_endpoint: true           # WS /v1/asr/ws, with its own VAD
    languages: [25 Indian languages]
    notes: >-
      Canary 1.2B. Both STT models return partial transcripts mid-utterance;
      the difference is cost, not capability. indic-conformer re-transcribes the
      whole segment every 600 ms, so work grows with utterance length; this one
      decodes incrementally, so each new word costs one word. Checkpoint lives
      in a private HuggingFace repo and needs a token with read access. Source
      is unreleased -- see the folder README. Run on ace-h200.

  - id: indic-nemotron
    name: AI4Bharat Nemotron Streaming ASR 600M
    status: ready
    runtime: nemo
    sample_rate: 16000
    upload_format: wav
    partial_transcripts: native        # monotonic deltas, already OpenAI-spec
    streaming_endpoint: true           # WS /v1/asr/ws, with its own VAD
    realtime_endpoint: true            # WS /v1/realtime?intent=transcription
    latency_ms: 320                    # att_context 96,3; see the folder overlay
    languages: [hi, mr, bn, ta, te, gu, kn, ml, pa, or, as, ur, sa, ne, sd, mai, doi, kok, brx, mni, sat, ks, bho, hne, bgc, bhb, en]
    notes: >-
      Vendored whole from the monorepo's nemotron_asr_server; every file in the
      folder except compose.extra.yml, fetch.sh and .env.example is upstream's,
      byte for byte. Serves its own demo page at `/` rather than `/demo`, which
      the gateway reaches via STT_DEMO_PATH instead of us patching it.
      27 languages from one multisoftmax checkpoint (27 x 256 tokens = 6912
      classes, the prompt selecting the slice) plus Bhili on a second
      checkpoint, so it is a superset of both other STT models -- switching to
      it cannot lose a language a caller can ask for. Bhili needs no separate
      flag, unlike indic-conformer.
      Latency is chosen at inference time: 160 / 320 / 640 ms. Upstream's code
      default is 640; this deployment declares 320, which beats
      indic-transcribe's 400 ms floor.
      No "auto" language, deliberately -- the vocabulary is sliced per language
      and an unsliced decode emits cross-script nonsense. Upstream measured two
      language-ID designs and neither discriminated, so callers must name one.
      Both checkpoints are gated on HuggingFace, and manually: a token is not
      enough, a maintainer has to approve each account.
      Running on ace-h200 GPU 1 since 2 September 2026 -- both checkpoints
      loaded, 320 ms confirmed at /health.

  - id: canary
    name: NVIDIA Canary
    status: planned
    runtime: nemo
    notes: European-language focus; role in an Indic stack still to be decided.

tts:
  - id: indic-parler
    name: AI4Bharat Indic Parler TTS
    status: ready
    runtime: parler
    sample_rate: 44100
    streaming: true          # streams PCM as it generates, over chunked HTTP
    voice: {presets: [Divya], free_text_description: true, cloning: false}
    languages: [hi, bn, ta, te, kn, ml, mr, gu, pa, or, as, ur, ne, sa, brx, doi, kok, ks, mai, mni, sat, sd, bhb]

  - id: indic-mio
    name: SPRINGLab Indic-Mio 0.6B
    status: ready
    runtime: vllm
    sample_rate: 44100
    audio_format: pcm_f32le      # native; also serves pcm (16-bit) on request
    streaming: true
    voice: {presets: [Aditi, Meera, Ananya, Rahul, Arjun], cloning: true}
    notes: >-
      Qwen3-0.6B backbone with MioCodec. Two containers: token generation is a
      vLLM sidecar this folder brings via compose.extra.yml. Not yet run on
      hardware.

  - id: orpheus
    name: AI4Bharat Orpheus Indic TTS
    status: ready
    runtime: vllm
    sample_rate: 24000
    audio_format: pcm            # OpenAI's 16-bit LE mono; Parler serves pcm_f32le
    streaming: true
    voice: {presets: from-roster, free_text_description: false, cloning: false}
    languages: [22 Indian languages]
    notes: >-
      Llama-3.2-3B backbone with SNAC codec, served by vLLM. The speaker name
      picks the language, so `voice` and `language` are not independent.
      Running on ace-h200 GPU 1, on the bodhan-ai/indic-speak checkpoint (the released model; the deployment was on indic-speak-preview-v2 before). Decoded with SNAC's own decoder -- the release ships a fine-tuned Vocos decoder it was actually tuned for, which is not wired up yet.

  - id: rumik-oss-1
    name: Rumik OSS-1 3B
    status: ready
    runtime: transformers          # no vLLM: a per-token loop over a 3B backbone
    sample_rate: 24000
    audio_format: pcm              # OpenAI's 16-bit LE mono, like orpheus
    streaming: true                # chunked while generating, and SSE audio deltas
    license: cc-by-nc-4.0          # NON-COMMERCIAL. See the note below.
    voice: {presets: [Ira, Aisha, Siya, Zoya], free_text_description: true, cloning: false}
    languages: [22 Indian languages, en]
    notes: >-
      Cohere2-style 3B backbone emitting Mimi codec tokens, eight per frame at
      12.5 Hz -- so eight tokens are one 80 ms frame and realtime is 100 tokens
      per second of speech. The Mimi decoder ships inside the same repo, so
      unlike orpheus this folder needs no second HuggingFace repo at startup and
      runs airgapped once fetch.sh has run. Repo is public, not gated.
      Every voice covers every language, which is the real difference from
      orpheus, where the speaker name selects the language and `voice` and
      `language` are therefore not independent. Delivery is a free-text
      description -- emotion, accent, pace -- carried on `instructions`, as with
      indic-parler.
      LICENCE IS CC-BY-NC-4.0 with an acceptable-use addendum: research and
      non-commercial use only, and a commercial deployment needs separate
      permission from Rumik. This is the only model in this catalogue with that
      restriction, which is why `license` appears here at all.
      MEASURED, and it does not reach realtime. On ace-h200 GPU 1 (H200 NVL,
      Exclusive Process behind the shared MPS daemon), 15 Sep 2026: ~45 tok/s
      warm (43.1-48.9 over three runs), RTF 2.05-2.33, time-to-first-audio
      ~370 ms. Realtime needs 100 tok/s, so this is about 2.2x too slow to hold
      a live call -- audio starts promptly and then underruns. The first
      generation after a cold context runs at 12.5 tok/s (RTF 8.0), which is
      what the 256-token warmup exists to absorb.
      The cost is upstream's decode loop, not the slot: one 3B forward per token
      in Python, eager, no CUDA graphs, no continuous batching. Running
      `generate_audio` directly with no server, no tap and no streaming decode
      reproduces the same 45 tok/s to the decimal, so the slot's layer adds no
      measurable overhead. Closing the gap means an inference engine, not
      tuning -- vLLM already supports Cohere2, and the deltas here are an
      enlarged vocab, a stop head and constrained sampling, so an adapter may
      be tractable. Until then treat this as demo and evaluation grade.
      Still unverified: the streaming decode's left-context window, a chosen 32
      frames rather than a measured one. The folder README says what to run.

  - id: omnivoice
    name: k2-fsa OmniVoice 0.6B
    status: planned
    runtime: pytorch
    voice: {cloning: true}
    notes: Diffusion-style, so not vLLM-servable; needs its own runtime.

llm:
  - id: qwen3.5-4b
    name: Qwen3.5-4B
    status: ready
    runtime: vllm
    quantization: none       # bf16; ~8 GB of weights, which this box can spare
    context: 8192            # capped for telephony; the model natively does 262144
    thinking: default-on     # voice server sends enable_thinking=false per request
    languages: [201 languages and dialects]
    notes: Not yet run on hardware -- flags are unverified against a live model.

  - id: gemma
    name: Gemma
    status: planned
    runtime: vllm

  - id: llama
    name: Llama
    status: planned
    runtime: vllm
