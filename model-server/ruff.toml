# Applies to the whole model-server tree.
line-length = 100
target-version = "py312"

# Vendored upstream code is excluded; everything we author stays strict.
#
# Most model folders are somebody else's project lifted in whole. Restyling that
# to our rules would turn every future sync from upstream into a merge conflict
# for no behavioural gain -- and a diff full of cosmetic churn is where a real
# change hides. What the slot actually requires of these folders is pinned by
# tests, not by lint.
#
# This list is deliberately path-by-path rather than a blanket `stt/**`,
# `tts/**`. The files we write to fit a model into the slot sit *inside* these
# folders -- tts/indic-mio/server.py is ours, and it is linted -- so a blanket
# rule would quietly stop checking our own code the day someone adds a file.
exclude = [
  "*/src/orpheus_server/**",        # tts/orpheus: AI4Bharat's server, verbatim
  "stt/indic-conformer/model.py",
  "stt/indic-conformer/server.py",
  "stt/indic-transcribe/**",        # entirely upstream; only the Dockerfile is ours
  # stt/indic-nemotron: the model server, vendored byte for byte from the
  # monorepo's nemotron_asr_server. Listed file by file, per the note above --
  # a blanket stt/indic-nemotron/** would also stop checking anything we later
  # add to that folder, and the whole point of the folder is that our parts and
  # theirs stay distinguishable.
  "stt/indic-nemotron/server.py",
  "stt/indic-nemotron/asr_engine.py",
  "stt/indic-nemotron/session.py",
  "stt/indic-nemotron/openai_api.py",
  "stt/indic-nemotron/audio_io.py",
  "tts/indic-parler/inference/**",  # the continuous-batching engine
  "tts/indic-mio/config.py",
  "tts/indic-mio/tts_engine.py",
  "tts/indic-mio/scripts/**",
]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ARG"]

[lint.flake8-bugbear]
# FastAPI *requires* these in argument defaults -- it is the framework's idiom,
# not the mutable-default bug B008 is looking for.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends", "fastapi.Body"]

[lint.per-file-ignores]
# Stubs exist to satisfy a signature and ignore the arguments. That is the point.
"tests/stubs/**/*.py" = ["ARG001", "ARG002", "ARG004", "F401"]

# The same argument applies to stubs defined inline in a test rather than under
# stubs/ -- a fake model must accept `batch_size` and `language_id` because the
# real one is called with them, and ignoring them is the whole reason it exists.
# Scoped to ARG* only: every other rule still applies to test code.
"tests/**/*.py" = ["ARG001", "ARG002", "ARG004"]

# A vendored inference engine typically implements several interchangeable
# KV-cache backends behind one factory. They share a
# signature, so each necessarily ignores arguments the others use -- that is
# interface conformance, not dead parameters.
#
# Indic Parler's engine is excluded outright above, so this currently matches
# nothing. It is kept for the next model that vendors an engine the same way but
# is otherwise clean enough to lint.
"tts/*/inference/**/*.py" = ["ARG001", "ARG002"]
