# What higgs-tts-3 needs beyond the slot's own container.
#
# Two containers, like tts/indic-mio: generation runs in an SGLang-Omni SIDECAR,
# and the slot's `tts` service is a thin adapter in front of it. SGLang-Omni
# already serves an OpenAI-shaped /v1/audio/speech for Higgs, but not the slot's
# contract -- named voices, a fixed `instructions` vocabulary, X-Audio-Format --
# and its image (CUDA, SGLang, UCX, flash-attn) is not something to rebuild
# inside a model folder. So the folder brings the sidecar, and the slot contract
# is unchanged: one service named `tts` on 8002, answering the OpenAI route. The
# sidecar publishes nothing and is reachable only by `tts`, on model_net.
#
#   docker compose -f compose.model-server.yml \
#                  -f tts/higgs-tts-3/compose.extra.yml --project-directory . up -d
#
# setup.sh adds this overlay by existence when TTS_MODEL=higgs-tts-3. Paths here
# resolve against the project directory (model-server/), not this file.
#
# EVERY KNOB IS DECLARED HERE. Compose passes a variable into a container only
# if `environment:` names it; one set in .env and missing below is inert.
# tests/test_engine_env_surface.py fails the build for that.

services:
  higgs-sglang:
    build:
      context: ./tts/higgs-tts-3/sidecar
      args:
        # Defaults are upstream's v0.1.9 pins (see sidecar/Dockerfile); override
        # only to move to another release, all three together.
        SGLANG_IMAGE: ${HIGGS_SGLANG_BASE_IMAGE:-lmsysorg/sglang@sha256:5fc09edb6a0bb1d5b6992b543723c66d08f86d7a507e951e87e0d05db4ac766e}
        SGLANG_OMNI_REF: v${HIGGS_SGLANG_OMNI_VERSION:-0.1.9}
        SGLANG_OMNI_COMMIT: ${HIGGS_SGLANG_OMNI_COMMIT:-8200f49934d66de591c035cab1c626c0600905fa}
    image: voicera/model-tts-higgs-sglang:${HIGGS_SGLANG_OMNI_VERSION:-0.1.9}
    container_name: voicera_model_tts_higgs_sglang
    restart: unless-stopped
    # A long utterance is a long generation; give in-flight streams room on a
    # redeploy instead of the default 10 s SIGKILL.
    stop_grace_period: 60s
    command:
      - sgl-omni
      - serve
      # bosonai/higgs-audio-v3-tts-4b is the same repo under its old name; HF
      # redirects it. Public, not gated -- no token needed. fetch.sh pre-pulls it.
      - --model-path=${HIGGS_MODEL_ID:-bosonai/higgs-tts-3-4b}
      # What the sidecar reports at /v1/models. Kept equal to the folder and
      # catalogue id: one spelling of one model.
      - --model-name=${HIGGS_MODEL_NAME:-higgs-tts-3}
      - --host=0.0.0.0
      - --port=8000
      # The only directory a reference clip may be read from. The adapter sends
      # /voices/refs/<clip>.wav; the mount below provides it, read-only.
      - --allowed-local-media-path=/voices
      # ---- GPU memory: THE setting to get right on a shared card ----------
      # Upstream's Higgs layout reserves 0.03 + 0.85 + 0.10 = 98% OF THE WHOLE
      # CARD at startup (encoder, engine, vocoder). Each value is a fraction of
      # the card's TOTAL memory, held whether used or not, and MPS does not
      # partition memory -- on ace-h200 that is production's memory. Same trap
      # tts/orpheus and tts/rumik-oss-1 document.
      #
      # These defaults are H200-SPECIFIC (143 GB): 0.12 is ~17 GB for the
      # engine (~10 GB of bf16 weights + KV), 0.03 ~4 GB for the vocoder and its
      # CUDA graphs, 0.02 ~3 GB for the reference encoder. On an 80 GB card
      # scale them up (~0.22 / 0.05 / 0.04); on 48 GB further. UNMEASURED: the
      # first run on hardware is what confirms them -- see the folder README.
      - --tts_engine.gpu_memory_fraction=${HIGGS_ENGINE_GPU_MEMORY_FRACTION:-0.12}
      - --vocoder.gpu_memory_fraction=${HIGGS_VOCODER_GPU_MEMORY_FRACTION:-0.03}
      - --audio_encoder.gpu_memory_fraction=${HIGGS_ENCODER_GPU_MEMORY_FRACTION:-0.02}
      - --log-level=${HIGGS_SIDECAR_LOG_LEVEL:-info}
    environment:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # sglang-omni stops the whole pipeline when any process reports no
      # startup progress for this long (default 600 s). The first start
      # autotunes GPU kernels for every CUDA-graph batch size, and on ace-h200
      # (22 Oct 2026) the reference-encoder process sat silent past 600 s while
      # the engine tuned. Later starts reuse the compile cache below and are
      # far shorter; this only has to cover the first.
      SGLANG_OMNI_STARTUP_TIMEOUT: ${HIGGS_STARTUP_TIMEOUT_S:-3600}
      # PyTorch Inductor's and Triton's caches default to /tmp in the
      # container, so every recreate (a rebuild, `down`/`up`) re-ran that
      # whole autotune. Kept in a volume, it is paid once per host.
      TORCHINDUCTOR_CACHE_DIR: /compile-cache/inductor
      TRITON_CACHE_DIR: /compile-cache/triton
      # Not required (the repo is public); passed through for the rate limit.
      HF_TOKEN: ${TTS_HF_TOKEN:-${HF_TOKEN:-}}
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./tts/higgs-tts-3/voices:/voices:ro
      - higgs_compile_cache:/compile-cache
    networks: [model_net]
    # SGLang wants the host IPC namespace and a large shm for its inter-stage
    # transport, whether or not MPS is in play.
    ipc: host
    shm_size: 16gb
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start downloads ~10 GB and captures CUDA graphs.
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Part of the TTS slot, so it follows the TTS slot's card.
              device_ids: ["${TTS_GPU_DEVICE_IDS:-${GPU_DEVICE_IDS:-0}}"]
              capabilities: [gpu]

  tts:
    stop_grace_period: 60s
    environment:
      # ---- sidecar -----------------------------------------------------
      HIGGS_SIDECAR_URL: ${HIGGS_SIDECAR_URL:-http://higgs-sglang:8000}
      # Longest wait for the next byte from the sidecar. The first byte is the
      # first audio chunk, so this bounds time-to-first-audio under load too.
      HIGGS_SIDECAR_TIMEOUT_S: ${HIGGS_SIDECAR_TIMEOUT_S:-60}
      # Where the SIDECAR sees voices/ -- must match the mount above.
      HIGGS_SIDECAR_VOICES_DIR: ${HIGGS_SIDECAR_VOICES_DIR:-/voices}

      # ---- this server -------------------------------------------------
      HIGGS_MODEL_NAME: ${HIGGS_MODEL_NAME:-higgs-tts-3}
      # Where the ADAPTER reads the manifest: the slot mounts the folder at /app.
      HIGGS_VOICES_DIR: ${HIGGS_VOICES_DIR:-/app/voices}
      HIGGS_HOST: ${HIGGS_HOST:-0.0.0.0}
      HIGGS_LOG_LEVEL: ${HIGGS_LOG_LEVEL:-INFO}
      HIGGS_CORS_ORIGINS: ${HIGGS_CORS_ORIGINS:-}
      # Bearer key for /v1/*. Empty (default) = none: inside the stack only the
      # gateway reaches this service, and the gateway has no auth either.
      HIGGS_API_KEY: ${HIGGS_API_KEY:-}
      HIGGS_REQUIRE_API_KEY: ${HIGGS_REQUIRE_API_KEY:-false}
      # ~30 s of speech at 12-15 characters a second; the context is 8192
      # tokens. A longer input is a 400 saying so, not audio cut off mid-word.
      HIGGS_MAX_INPUT_CHARS: ${HIGGS_MAX_INPUT_CHARS:-400}

      # ---- synthesis defaults ------------------------------------------
      HIGGS_DEFAULT_VOICE: ${HIGGS_DEFAULT_VOICE:-Aditi}
      # Delivery tags applied when a request sends no `instructions`, e.g.
      # "emotion:contentment". Empty means none. Same fixed vocabulary.
      HIGGS_DEFAULT_INSTRUCTIONS: ${HIGGS_DEFAULT_INSTRUCTIONS:-}
      # voice="default" = no reference clip, a random speaker per request.
      # Useful only to bring the slot up before voices/refs/ has clips; never
      # for calls, where the voice would change sentence to sentence.
      HIGGS_ALLOW_ZERO_SHOT: ${HIGGS_ALLOW_ZERO_SHOT:-false}
      # Model card: temperature 0.8, top_k 50. top_p 0.8 is SGLang-Omni's
      # default for this model, restated so it is a decision and not inherited.
      HIGGS_TEMPERATURE: ${HIGGS_TEMPERATURE:-0.8}
      HIGGS_TOP_K: ${HIGGS_TOP_K:-50}
      HIGGS_TOP_P: ${HIGGS_TOP_P:-0.8}
      # Audio frames, 25 per second: 1024 is ~41 s, 2048 ~82 s. A ceiling, not a
      # target -- the model ends the utterance itself.
      HIGGS_MAX_NEW_TOKENS_DEFAULT: ${HIGGS_MAX_NEW_TOKENS_DEFAULT:-1024}
      HIGGS_MAX_NEW_TOKENS_LIMIT: ${HIGGS_MAX_NEW_TOKENS_LIMIT:-2048}
      # Frames in the FIRST audio chunk. Empty = the sidecar's default (20, i.e.
      # 800 ms of audio before anything is sent). Lower cuts time-to-first-audio
      # at some cost in first-chunk quality; 0 uses the steady chunk size.
      HIGGS_INITIAL_CHUNK_FRAMES: ${HIGGS_INITIAL_CHUNK_FRAMES:-}
    depends_on:
      - higgs-sglang

volumes:
  # Compiled GPU kernels for the sidecar (Inductor + Triton), so the long
  # first-start autotune is paid once per host, not once per container.
  higgs_compile_cache:
